- type: entity
  parent: [ClothingOuterHardsuitBase, BaseMagicalContraband]
  id: ClothingArmorDarkIce
  name: Доспехи Тёмного льда
  description: Не просто сталь и лёд, а воплощение самой зимы. Тяжёлые пластины отлиты из чёрного металла, будто выточенного из вечной тьмы, и покрыты тончайшей сетью призрачных рун, которые вспыхивают тусклым голубым светом.
  components:
  - type: Sprite
    sprite: _Soton/Clothing/OuterClothing/Dark_ice_armor.rsi
  - type: Clothing
    sprite: _Soton/Clothing/OuterClothing/Dark_ice_armor.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.05
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.65
  - type: Armor
    traumaDeductions:
      Dismemberment: 0.3
      OrganDamage: 0.3
      BoneDamage: 0.3
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.35
        Slash: 0.35
        Piercing: 0.35
        Heat: 0.8
        Radiation: 0.15
        Caustic: 0.5
  - type: ToggleableClothing # Goobstation - Modsuits change
    clothingPrototypes:
      head: ClothingHeadArmorDarkIce
  - type: ModifyDelayedKnockdown # Goobstation
    delayDelta: 2
    knockdownTimeDelta: -2
  - type: StaminaResistance
    damageCoefficient: 0.3

- type: entity
  parent: [ClothingHeadHelmetHardsuitBlueshield, BaseMagicalContraband]
  id: ClothingHeadArmorDarkIce
  name: Шлем Тёмного льда
  description: Не просто защита, а сосуд для бесконечной воли смерти. Его изогнутые рога, будто выточенные из самого льда бездны, устремляются вверх, словно пытаются пронзить небеса и подчинить себе саму вечность. Между рогами пульсирует ледяной кристалл—осколок Ледяного Трона, в котором эхом звучат голоса тысяч павших душ.
  components:
  - type: Sprite
    sprite: _Soton/Clothing/Head/Dark_ice_helmet.rsi
    state: icon
  - type: Clothing
    sprite: _Soton/Clothing/Head/Dark_ice_helmet.rsi
  - type: PointLight
    color: "#1d59ca"
    rotation: 30
    energy: 12
    radius: 6
  - type: FlashImmunity
  - type: FlashSoundSuppression
  - type: Armor
    traumaDeductions:
      Dismemberment: 0.2
      OrganDamage: 0.2
      BoneDamage: 0.2
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.45
        Slash: 0.45
        Piercing: 0.45
        Heat: 0.7
        Radiation: 0.1 # CorvaxGoob-changes: 0.9 > 0.0
        Caustic: 0.5
  - type: FireProtection
    reduction: 0.9
