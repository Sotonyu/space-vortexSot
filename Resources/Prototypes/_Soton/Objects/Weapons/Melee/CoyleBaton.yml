- type: entity
  id: CoyleBaton
  parent: [BaseMagicalContraband, TelescopicBaton]
  name: Верная дубинка
  description: Компактная, самодельная дубинка, созданная Лиландом Койлом для обеспечения справедливости.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Melee/contractor_baton.rsi
    layers:
    - state: icon-off
      map: [ "enum.ItemToggleVisuals.Layer" ]
  - type: Item
    sprite: _Goobstation/Objects/Weapons/Melee/contractor_baton.rsi
  - type: Clothing
    sprite: _Goobstation/Objects/Weapons/Melee/contractor_baton.rsi
  - type: TelescopicBaton
    alwaysDropItems: true
  - type: UseDelay
    delays:
      default:
        length: 1
      telebaton:
        length: 1
  - type: ItemToggle
    soundActivate:
      path: /Audio/_Goobstation/Weapons/Baton/contractorbatonextend.ogg
    soundDeactivate:
      path: /Audio/_Goobstation/Weapons/Baton/contractorbatonextend.ogg
  - type: ItemToggleMeleeWeapon
    activatedSoundOnHit:
      path: /Audio/_Goobstation/Weapons/Baton/contractorbatonhit.ogg
      params:
        variation: 0.250
    activatedDamage:
      types:
        Shock: 25
        Ion: 35
  - type: MeleeWeapon
    bluntStaminaDamageFactor: 0
  - type: StaminaDamageOnHit
    damage: 35
  - type: StunBorgsOnHit
  - type: TogglePreventStaminaDamage
  - type: PointLight
    radius: 2
    energy: 0.5
    color: "#79F6FC"
    castShadows: true
