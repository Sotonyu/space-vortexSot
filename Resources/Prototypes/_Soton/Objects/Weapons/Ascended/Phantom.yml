- type: entity
  parent: [ BaseKnife, BaseWeaponCrusher, BaseMagicalContraband]
  id: LumadaggerPhantom
  name: Фантом
  description: Этот нож - духовное оружие, несущее в себе любовь и вместе с этим быструю смерть. Его монолитный розоватый цвет вибрирует, будто бы сама гравитация сосредоточена только на нём. Являющийся продолжением души Сверхновой, Фантом есть скорость и легкость, что нельзя почувствовать. Ни один порез, полученный этим ножом не чувствуется, что быстро и неумолимо приводит врагов к отключке, а затем и к верной, безболезненной смерти. Словно жидкость, он течёт в руках владелицы, готовый судьбы других решать, а Сверхновой Судьбы - направлять...
  components:
  - type: Sprite
    sprite: _Soton/Objects/Weapons/Ascended/Phantom.rsi
    state: icon
  - type: MeleeWeapon
    autoAttack: true
    wideAnimationRotation: -135
    attackRate: 6
    damage:
      types:
        Slash: 25
        Holy: 15
  - type: Tag
    tags:
    - Knife
  - type: EmbeddableProjectile
    sound: /Audio/Weapons/star_hit.ogg
    offset: -0.15,0.0
  - type: LandAtCursor
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 35
  - type: DisarmMalus
    malus: 0.225
  - type: ThrowingAngle
    angle: 225
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          radius: 0.01
          vertices:
          - -0.4,-0.2
          - -0.2,-0.4
          - 0.4,0.2
          - 0.2,0.4
        density: 20 # derived from base_item
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
