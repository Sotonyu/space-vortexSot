- type: entity
  parent: [ BaseKnife, BaseMagicalContraband]
  id: LumabladeKristol
  name: Кристоль
  description: Этот причудливый кинжал - духовное оружие, сотканное из ледяной магии Кэла Кеппеля. Он кристально чистый, но меняет цвет с чем-то тёмным, глубинным... Будто бы Тьма во плоти иногда проступает, как призрак прошлого... Кристоль является воплощением одновременно и хладнокровности и лёгкого зимнего ветерка. Но разозлённый Звёздный Иней превращает этот лёд в страшное оружие кары... Или защиты, если он готов драться за близких до последнего...
  components:
  - type: Sprite
    sprite: _Soton/Objects/Weapons/Ascended/Kristol.rsi
    state: icon
  - type: MeleeWeapon
    autoAttack: true
    wideAnimationRotation: -135
    attackRate: 3
    damage:
      types:
        Slash: 25
        Holy: 50
        Heat: 15
  - type: Tag
    tags:
    - Knife
  - type: EmbeddableProjectile
    sound: /Audio/Weapons/star_hit.ogg
    offset: -0.15,0.0
  - type: LandAtCursor
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 35
  - type: DisarmMalus
    malus: 0.225
  - type: ThrowingAngle
    angle: 225
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          radius: 0.01
          vertices:
          - -0.4,-0.2
          - -0.2,-0.4
          - 0.4,0.2
          - 0.2,0.4
        density: 20 # derived from base_item
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
