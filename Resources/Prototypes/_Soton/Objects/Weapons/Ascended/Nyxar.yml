- type: entity
  name: Никсар
  parent: [BaseSword, BaseMagicalContraband]
  id: HolyLumaNyxar
  description: Настоящий свет Бездны сияет в твоей руке.
  components:
  - type: Sprite
    sprite: _Soton/Objects/Weapons/Ascended/Nyxar.rsi
    state: icon
  - type: Item
    size: Normal
    sprite: _Soton/Objects/Weapons/Ascended/Nyxar.rsi
  - type: MeleeWeapon
    attackRate: 0.7
    damage:
      types:
        Heat: 15
        Slash: 5
        Holy: 10
    soundHit:
      path: /Audio/Weapons/Guns/Hits/energy_meat1.ogg
  - type: IgniteOnMeleeHit # emphasis on FLAMING GIFT!!
    fireStacks: 0.25
  - type: Tool
    qualities:
    - Prying
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: AlwaysHot
  - type: Execution # It's not sharp per se, but who's against executing heretics with a giant flaming hand from god?
    doAfterDuration: 4.0
  - type: UseDelay
    delay: 1
  - type: Prying
  - type: PointLight
    radius: 5
    energy: 2
    color: "#82b3f3"
    castShadows: true
