- type: entity
  name: Зелёная Люма
  parent: [BaseSword, BaseMagicalContraband]
  id: HolyLumaHeal
  description: Зелёные искры летают вокруг твоей ладони..
  components:
  - type: Sprite
    sprite: _Soton/Objects/Weapons/Ascended/Luma.rsi
    state: icon
  - type: Item
    size: Normal
    sprite: _Soton/Objects/Weapons/Ascended/Luma.rsi
  - type: MeleeWeapon
    attackRate: 0.7
    damage:
      types:
        Heat: 5
        Slash: 5
        Holy: 15
    soundHit:
      path: /Audio/Weapons/Guns/Hits/energy_meat1.ogg
  - type: IgniteOnMeleeHit # emphasis on FLAMING GIFT!!
    fireStacks: 0.25
  - type: Tool
    qualities:
    - Prying
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: AlwaysHot
  - type: Execution # It's not sharp per se, but who's against executing heretics with a giant flaming hand from god?
    doAfterDuration: 4.0
  - type: UseDelay
    delay: 1
  - type: Prying
    pryPowered: true
  - type: PointLight
    radius: 5
    energy: 2
    color: "#38d12a"
    castShadows: true
  - type: AlternatePrayable
    repeatPrayer: true
  - type: HealNearOnPray # These numbers look high but WoundMed...
    healing:
      groups:
        Brute: -50
      types:
        Slash: -30
        Heat: -30
        Cold: -30
        Shock: -30
  - type: Nullrod
    DamageOnUntrainedUse:
      types:
        Piercing: 10
        Heat: 10
    UntrainedUseString: nullrod-spear-untrained-usage-popup
