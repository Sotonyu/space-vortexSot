- type: entity
  parent: BaseSecurityPDA
  id: KnightPDA
  name: КПК Рыцаря Звёздной Пыли
  description: Этот особенный КПК сразу показывает что вы не обычный офицер.
  components:
  - type: Pda
    id: KnightIDCard
  - type: Appearance
    appearanceDataInit:
     enum.PdaVisuals.PdaType:
       !type:String
       pda-hos
  - type: PdaBorderColor
    borderColor: "#A32D26"
    accentHColor: "#c9cc2b"
  - type: Icon
    state: pda-hos
  - type: CartridgeLoader
    preinstalled:
    - CrewManifestCartridge
    - NotekeeperCartridge
    - NanoTaskCartridge
    - NewsReaderCartridge
    - WantedListCartridge
    - LogProbeCartridge
    - NanoChatCartridge # DeltaV
    - WalletCartridge # <Onyx Economy>

