- type: entity
  name: Паспорт
  parent: BaseItem
  id: BasePassport
  abstract: true
  description: Паспорт, удостоверяющий личность и национальность существа.
  components:
  - type: Sprite
    sprite: _Soton/Objects/Misc/Passport.rsi
    layers:
    - state: passport_ussp_closed
      map: [ "base" ]
  - type: Item
    size: Small
  - type: Appearance
  - type: ToggleAnimation
    toggleOffTime: 0
    toggleOnTime: 0
  - type: ItemToggle
  - type: GenericVisualizer
    visuals:
      enum.ToggleAnimationVisuals.ToggleState:
        base:
          On: { state: passport_ussp_open }
          Off: { state: passport_ussp_closed }
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Goobstation/Items/handling/book_pickup.ogg
      params:
        volume: -4
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_Goobstation/Items/handling/book_drop.ogg
      params:
        volume: -4
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Goobstation/Items/handling/book_drop.ogg
      params:
        volume: -4

- type: entity
  id: PassportUSSP
  name: Паспорт СССП
  parent: BasePassport
  description: Официальный документ, удостоверяющий личность гражданина Союза Советских Социалистических Планет. Предписывает уважать труд, порядок и интересы Союза.
  components:
  - type: Sprite
    sprite: _Soton/Objects/Misc/Passport.rsi
    layers:
    - state: passport_ussp_closed
      map: [ "base" ]
  - type: GenericVisualizer
    visuals:
      enum.ToggleAnimationVisuals.ToggleState:
        base:
          On: { state: passport_ussp_open }
          Off: { state: passport_ussp_closed }

