  name: Замороженный стаут
  parent: BaseAlcohol
  desc: Древний рецепт тысячелетней давности, найденный на островах звёздного сияния. У него прекрасный вкус чести, золота и славных дней. Лучше всего подавать охлажденным почти до абсолютного нуля.
