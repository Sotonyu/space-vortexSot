- type: reagent
  id: OilyOaf
  name: Жирный олух
  parent: BaseAlcohol
  desc: Жирный Олух. Любимое пиво Дворфов. Это один из легендарных напитков дальних секторов. Смесь богатого, горьковатого послевкусия вместе с низкой ценой означают то, что Олух всегда будет в изобилии. Скала и Камень!
  physicalDesc: reagent-physical-desc-fizzy-and-creamy
  flavor: oilyoaf
  color: "#a75729"
  metamorphicSprite:
    sprite: _Soton/Objects/Consumables/Drinks/Oilyoaf.rsi
    state: icon_empty
  metamorphicMaxFillLevels: 2
  metamorphicFillBaseName: fill-
  metamorphicChangeColor: false
  metabolisms:
    Drink:
      effects:
        - !type:SatiateThirst
          factor: 2
        - !type:AdjustReagent
          reagent: Ethanol
          amount: 0.15
        - !type:AdjustReagent
          reagent: Beer
          amount: 0.05
        - !type:ModifyStatusEffect
          effectProto: StatusEffectDrowsiness
          time: 1
          type: Remove
  fizziness: 0.15

